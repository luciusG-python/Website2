<svg overflow="visible" style="display: block;" width="205.197" height="324.993" viewBox="0 0 205.197 324.993" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Figma 5936:9096: PROGRESSIVE LAYER_BLUR startRadius=0 (tip) → radius=24 (base), top→bottom -->
  <defs>
    <linearGradient id="paintL" x1="102.599" y1="24" x2="102.599" y2="300.993" gradientUnits="userSpaceOnUse">
      <stop stop-color="#073E91"/>
      <stop offset="1" stop-color="#02122B"/>
    </linearGradient>
    <!-- Sharp: opaque at tip → transparent at base -->
    <linearGradient id="maskSharpL" x1="0" y1="24" x2="0" y2="300.993" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/>
      <stop offset="0.4" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <!-- Blur: transparent at tip → opaque at base -->
    <linearGradient id="maskBlurL" x1="0" y1="24" x2="0" y2="300.993" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="black"/>
      <stop offset="0.2" stop-color="white"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="mSharpL" maskUnits="userSpaceOnUse" x="0" y="0" width="205.197" height="324.993">
      <rect width="205.197" height="324.993" fill="url(#maskSharpL)"/>
    </mask>
    <mask id="mBlurL" maskUnits="userSpaceOnUse" x="0" y="0" width="205.197" height="324.993">
      <rect width="205.197" height="324.993" fill="url(#maskBlurL)"/>
    </mask>
    <filter id="blurL" x="-48" y="-48" width="301.197" height="420.993" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
  </defs>
  <g opacity="0.75">
    <!-- Blurred copy first (base), then sharp tip on top -->
    <g mask="url(#mBlurL)">
      <g filter="url(#blurL)">
        <path d="M181.197 153.231H153.795V300.993H51.4021V153.231H24L102.599 24L181.197 153.231Z" fill="url(#paintL)"/>
